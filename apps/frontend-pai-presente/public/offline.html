<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>Pai Presente — sem conexão</title>
    <style>
      :root {
        color-scheme: dark;
        --fundo: #09090b;
        --texto: #f2f2f2;
        --suave: #999999;
        --marca: #f8ce2b;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem;
        text-align: center;
        background: var(--fundo);
        color: var(--texto);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      img {
        width: 7rem;
        max-width: 100%;
        height: auto;
        border-radius: 1.5rem;
      }
      h1 {
        margin: 0;
        font-size: 1.375rem;
        color: var(--marca);
      }
      p {
        margin: 0;
        max-width: 26rem;
        line-height: 1.6;
        color: var(--suave);
      }
    </style>
  </head>
  <body>
    <img src="/marca-pai-presente.png" alt="Pai Presente" />
    <h1>Pai Presente</h1>
    <p>
      Você está sem conexão agora. Assim que a internet voltar, o app abre de
      novo — nada do que você escreveu se perdeu.
    </p>
  </body>
</html>
